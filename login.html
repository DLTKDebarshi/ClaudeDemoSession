<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Deltek Cloud AI Learning Community</title>
    <style>
        :root {
            --g-blue: #4285F4;
            --g-red: #EA4335;
            --g-green: #34A853;
            --text-main: #202124;
            --text-subtle: #5F6368;
            --radius-md: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Google Sans', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--g-blue) 0%, #5E35B1 100%);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 40px 20px;
        }
        .login-card {
            background: white; border-radius: 16px; padding: 48px 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }
        .login-card h1 {
            font-size: 28px; font-weight: 700; color: var(--text-main);
            text-align: center; margin-bottom: 8px;
        }
        .login-card .subtitle {
            font-size: 15px; color: var(--text-subtle); text-align: center;
            margin-bottom: 32px;
        }
        .field { margin-bottom: 20px; }
        .field label {
            display: block; font-size: 14px; font-weight: 600;
            color: var(--text-main); margin-bottom: 6px;
        }
        .field input {
            width: 100%; padding: 12px 16px; border: 2px solid #E2E8F0;
            border-radius: 8px; font-size: 16px; font-family: inherit;
            outline: none; transition: border-color 0.2s;
        }
        .field input:focus { border-color: var(--g-blue); }
        .field input.error { border-color: var(--g-red); }
        .login-btn {
            width: 100%; padding: 14px; background: var(--g-blue); color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 700;
            font-family: inherit; cursor: pointer; transition: background 0.2s;
        }
        .login-btn:hover { background: #1A73E8; }
        .error-msg {
            display: none; color: var(--g-red); font-size: 14px; font-weight: 600;
            text-align: center; margin-top: 16px;
            animation: shake 0.4s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .back-link {
            display: block; text-align: center; margin-top: 24px;
            font-size: 14px; color: var(--text-subtle); text-decoration: none;
        }
        .back-link:hover { color: var(--g-blue); }

        /* Already logged-in state */
        .logged-in-state { text-align: center; }
        .logged-in-state .badge {
            display: inline-block; padding: 8px 20px; border-radius: 20px;
            background: rgba(52,168,83,0.12); color: var(--g-green);
            font-weight: 600; font-size: 15px; margin-bottom: 20px;
        }
        .logged-in-state p { font-size: 16px; color: var(--text-subtle); margin-bottom: 24px; }
        .btn-row { display: flex; gap: 12px; justify-content: center; }
        .btn-secondary {
            padding: 12px 24px; border-radius: 8px; font-size: 15px;
            font-weight: 600; text-decoration: none; cursor: pointer;
            font-family: inherit; border: 2px solid #E2E8F0; background: white;
            color: var(--text-main); transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--g-blue); color: var(--g-blue); }
        .btn-primary-sm {
            padding: 12px 24px; border-radius: 8px; font-size: 15px;
            font-weight: 600; text-decoration: none; background: var(--g-blue);
            color: white; border: none; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary-sm:hover { background: #1A73E8; }

        .branding {
            margin-top: 32px; font-size: 13px; color: rgba(255,255,255,0.7);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card" id="loginCard">
    <!-- Login form (shown when not logged in) -->
    <div id="loginForm">
        <h1>Admin Login</h1>
        <p class="subtitle">Restricted access for session facilitators.</p>
        <form onsubmit="return handleLogin(event)">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" placeholder="Enter username" autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <div class="error-msg" id="errorMsg">Invalid username or password.</div>
        <a href="index.html" class="back-link">&larr; Back to site (no login needed for labs)</a>
    </div>

    <!-- Already logged in (shown when admin) -->
    <div id="loggedInState" class="logged-in-state" style="display:none;">
        <h1>Welcome Back</h1>
        <div class="badge">Admin Access Active</div>
        <p>You are already signed in as an administrator.</p>
        <div class="btn-row">
            <a href="index.html" class="btn-primary-sm">Go to Site</a>
            <button class="btn-secondary" onclick="Auth.logout()">Logout</button>
        </div>
    </div>
</div>

<div class="branding">Deltek Cloud AI Learning Community | #AIforALL</div>

<script src="auth.js"></script>
<script>
    /* If already admin, show the logged-in state */
    if (Auth.isAdmin()) {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('loggedInState').style.display = 'block';
    }

    function handleLogin(e) {
        e.preventDefault();
        var user = document.getElementById('username').value.trim();
        var pass = document.getElementById('password').value;
        if (Auth.login(user, pass)) {
            /* Redirect to returnUrl if provided, otherwise index */
            var params = new URLSearchParams(window.location.search);
            var returnUrl = params.get('returnUrl');
            if (returnUrl && /^[a-zA-Z0-9\-_.]+\.html$/.test(returnUrl)) {
                window.location.href = returnUrl;
            } else {
                window.location.href = 'index.html';
            }
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('username').classList.add('error');
            document.getElementById('password').classList.add('error');
            /* Reset shake animation */
            var msg = document.getElementById('errorMsg');
            msg.style.animation = 'none';
            msg.offsetHeight; /* trigger reflow */
            msg.style.animation = '';
        }
        return false;
    }
</script>
</body></html>
